<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#5a1a1f" />
		<meta
			name="description"
			content="Cinecat: tu biblioteca personal de cine y series, con el encanto de las marquesinas de barrio."
		/>
		<script>
			// Aplica el tema antes de pintar para evitar el parpadeo del tema claro.
			(function () {
				var stored = null;
				try {
					stored = window.localStorage.getItem('cinecat-theme');
				} catch (error) {
					stored = null;
				}
				var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
				var prefersDark = false;
				try {
					prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} catch (error) {
					prefersDark = false;
				}
				var theme = preference === 'dark' || (preference === 'system' && prefersDark) ? 'dark' : 'light';
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<link
			rel="preload"
			href="/fonts/Fraunces-Variable.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
