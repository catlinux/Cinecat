services:
  servidor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT: ${COMMIT:-}
        BUILT_AT: ${BUILT_AT:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CINECAT_API_PORT:-8080}:8080"
    volumes:
      - cinecat_data:/data
      # ro por defecto; rw solo si se activa la subida y la papelera (ver .env.deploy.example).
      - ${CINECAT_MEDIA_PATH}:/media:${CINECAT_MEDIA_MODE:-ro}
      - ./run:/run/cinecat-update
    environment:
      CINECAT_DB_PATH: /data/cinecat.db
      CINECAT_RUN_DIR: /run/cinecat-update
      CINECAT_MEDIA_ROOTS: ${CINECAT_MEDIA_ROOTS:-/media}
      CINECAT_TMDB_API_KEY: ${CINECAT_TMDB_API_KEY:-}
      CINECAT_OMDB_API_KEY: ${CINECAT_OMDB_API_KEY:-}
      CINECAT_SCAN_INTERVAL: ${CINECAT_SCAN_INTERVAL:-6h}
      CINECAT_WATCH: ${CINECAT_WATCH:-1}
      CINECAT_WATCH_QUIET: ${CINECAT_WATCH_QUIET:-2m}
      CINECAT_ADMIN_PASSWORD: ${CINECAT_ADMIN_PASSWORD:-}
      CINECAT_TRUSTED_PROXIES: ${CINECAT_TRUSTED_PROXIES:-}
      CINECAT_FILE_UID: ${CINECAT_FILE_UID:-}
      CINECAT_FILE_GID: ${CINECAT_FILE_GID:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CINECAT_WEB_PORT:-8081}:3000"
    environment:
      PUBLIC_API_URL: ""
      # Las subidas van directas al servidor por la red de Docker, sin salir a internet.
      INTERNAL_API_URL: http://servidor:8080
      PROTOCOL_HEADER: x-forwarded-proto
      # Apache añade X-Forwarded-For; XFF_DEPTH es el número de proxies de
      # confianza que hay delante de la web (1 = solo Apache).
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
      # adapter-node rechaza por defecto cuerpos de más de 512 KB; las subidas
      # las limita el servidor con «Tamaño máximo de subida (GB)».
      BODY_SIZE_LIMIT: Infinity
    depends_on:
      - servidor

volumes:
  cinecat_data:
