# Vhost de Apache para Cinecat (video.warcrafted.com).
#
# Requiere los módulos: proxy, proxy_http, headers.
# Comprobar con: a2enmod proxy proxy_http headers
#
# Tras activar este vhost, ejecuta:
#   sudo certbot --apache -d video.warcrafted.com
# Certbot añade el bloque :443 y el redirect de HTTP a HTTPS por sí mismo
# (modifica este mismo archivo), igual que con los demás vhosts del Debian.
# No añadas tú un bloque :443 a mano: certbot duplicaría la configuración.
#
# IMPORTANTE después de certbot: el bloque :443 que genera copia los
# ProxyPass de aquí pero NO cambia "X-Forwarded-Proto" a "https". Edita el
# nuevo bloque <VirtualHost *:443> y cambia esa línea a:
#   RequestHeader set X-Forwarded-Proto "https"
# Si no lo haces, la cookie de sesión no se marcará Secure en HTTPS.

# Las cabeceras de seguridad (X-Content-Type-Options, X-Frame-Options,
# Referrer-Policy, Permissions-Policy, la CSP mínima y HSTS) las ponen la web
# en hooks.server.ts y el servidor Go en su middleware, así que Apache no debe
# duplicarlas. Si alguna respuesta no pasara por la aplicación, podrían
# añadirse aquí; quedan comentadas como referencia:
# Header always set X-Content-Type-Options "nosniff"
# Header always set X-Frame-Options "DENY"
# Header always set Referrer-Policy "same-origin"
# Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
# Header always set Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
# HSTS solo tiene sentido en el bloque HTTPS:
# Header always set Strict-Transport-Security "max-age=31536000"
#
# ServerTokens Prod y ServerSignature Off se configuran en
# /etc/apache2/conf-available/security.conf del host, no en este vhost.

<VirtualHost *:80>
	ServerName video.warcrafted.com

	ProxyPreserveHost On

	ProxyPass /api/ http://127.0.0.1:8080/api/
	ProxyPassReverse /api/ http://127.0.0.1:8080/api/

	ProxyPass /healthz http://127.0.0.1:8080/healthz
	ProxyPassReverse /healthz http://127.0.0.1:8080/healthz

	ProxyPass / http://127.0.0.1:8081/
	ProxyPassReverse / http://127.0.0.1:8081/

	RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
