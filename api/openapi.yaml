        - file_title
        - year
        - poster_url
        - genres
        - season_count
        - episode_count
        - watched_count
        - match_status
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: Título visible; usa el de TMDB si existe.
        file_title:
          type: string
          description: Título analizado de la carpeta.
        year:
          type: integer
          nullable: true
        poster_url:
          type: string
          nullable: true
        genres:
          type: array
          description: Géneros; siempre es un array, aunque esté vacío.
          items:
            type: string
        season_count:
          type: integer
          format: int64
        episode_count:
          type: integer
          format: int64
        watched_count:
          type: integer
          format: int64
        match_status:
          type: string
          nullable: true
          enum: [auto, manual, none]
      additionalProperties: false
    SeriesResponse:
      type: object
      required:
        - series
        - total
        - limit
        - offset
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    SimilarSeriesResponse:
      type: object
      required:
        - series
      properties:
        series:
          type: array
          description: Series similares en orden de afinidad; siempre un array.
          items:
            $ref: '#/components/schemas/Series'
      additionalProperties: false
    Season:
      type: object
      required:
        - season
        - name
        - overview
        - poster_url
        - episode_count
        - watched_count
      properties:
        season:
          type: integer
        name:
          type: string
          description: Nombre de la temporada; por defecto «Temporada N».
        overview:
          type: string
          nullable: true
        poster_url:
          type: string
          nullable: true
        episode_count:
          type: integer
          format: int64
        watched_count:
          type: integer
          format: int64
      additionalProperties: false
    SeriesDetail:
      type: object
      required:
        - id
        - title
        - file_title
        - folder
        - original_title
        - year
        - tagline
        - overview
        - overview_language
        - poster_url
