  /api/v1/items/{id}/play:
    get:
      summary: Prepara la reproducción de un ítem
      description: |
        Elige entre reproducción directa (el contenedor se puede servir tal
        cual) y HLS MPEG-TS (recodificado a H.264 + AAC estéreo), y devuelve
        una URL firmada válida 8 horas (los segmentos reutilizan su firma). La URL apunta a `/api/v1/stream/...` y no requiere la
        cabecera de sesión: la autorización es la propia firma. Los parámetros
        ausentes se rellenan con las preferencias del usuario y, si no hay,
        con los valores por defecto del archivo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: audio
          in: query
          required: false
          description: Posición de la pista de audio (0..n-1).
          schema:
            type: integer
            minimum: 0
        - name: quality
          in: query
          required: false
          description: Calidad de reproducción.
          schema:
            type: string
            enum: [auto, original, "480", "720", "1080"]
        - name: subtitle
          in: query
          required: false
          description: Identificador del subtítulo, o vacío para desactivarlo.
          schema:
            type: string
      responses:
        '200':
          description: URL de reproducción preparada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResponse'
        '400':
          description: Audio, calidad o subtítulo no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Contenedor no soportado para reproducción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}:
    get:
      summary: Sirve el archivo directo o la playlist remux
      description: |
        Endpoint de las URLs firmadas. Con modo directo sirve el archivo con
        soporte de rangos HTTP; con modo remux sirve la playlist HLS. Una firma
        ausente, manipulada o caducada se rechaza con 403.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: audio
          in: query
          required: false
          description: Posición de la pista de audio (0..n-1).
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          required: false
          description: Calidad elegida.
          schema:
            type: string
            enum: [auto, original, "480", "720", "1080"]
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo o playlist
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '206':
          description: Parte del archivo directo (petición con Range)
        '400':
          description: Pista de audio o calidad no válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}/{file}:
    get:
      summary: Sirve la playlist o un segmento HLS
      description: |
        Archivos HLS: `playlist.m3u8` (VOD completa desde la primera petición)
        o `segment_XXXXX.ts` (MPEG-TS, `video/mp2t`). La playlist que se
        entrega lleva la firma en las URLs de sus segmentos. Un segmento que
        aún no existe se genera bajo demanda: si queda lejos de lo ya
        generado, el servidor relanza FFmpeg en él.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: file
          in: path
          required: true
          schema:
            type: string
        - name: audio
          in: query
          required: false
          description: Posición de la pista de audio (0..n-1).
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          required: false
          description: Calidad elegida.
          schema:
            type: string
            enum: [auto, original, "480", "720", "1080"]
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo del remux
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Pista de audio o calidad no válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nombre de archivo no válido o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}/subtitles/{file}:
    get:
      summary: Sirve un subtítulo convertido a WebVTT
      description: |
        Misma firma por ítem que el vídeo. `file` es `<sid>.vtt`, donde `sid`
        es `e<N>` para pistas incrustadas o `x<N>` para archivos externos.
