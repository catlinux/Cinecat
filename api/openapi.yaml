            minimum: 1
        - name: q
          in: query
          description: Texto a buscar; por defecto, el título analizado del archivo.
          required: false
          schema:
            type: string
        - name: year
          in: query
          description: Año opcional para afinar la búsqueda.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Candidatos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'
        '400':
          description: Parámetros no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/match:
    put:
      summary: Corrige a mano la ficha de una película (solo administradores)
      description: |
        Con un `tmdb_id` guarda la ficha de TMDB como corrección manual. Con
        `null` marca la película como «no es ninguna» y limpia sus metadatos.
        Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMatchRequest'
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Cuerpo no válido o tmdb_id incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al guardar la ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Vuelve a identificar una película automáticamente (solo administradores)
      description: |
        Limpia la corrección manual, restaura el año analizado del archivo y
        vuelve a identificar la película con TMDB. Si no hay coincidencia, el
        ítem queda sin identificar. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al guardar la ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
