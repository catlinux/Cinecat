  /api/v1/items:
    get:
      summary: Lista los ítems de las bibliotecas
      description: |
        Devuelve las entradas de `media_items` de bibliotecas de tipo `video`
        con paginación simple. Los clips de bibliotecas `clips` no aparecen en
        este listado: se navegan con `GET /api/v1/libraries/{id}/browse`. Los
        filtros se pueden combinar. Sin `sort`, el orden es estable por `id`.
      security:
        - bearerAuth: []
      parameters:
        - name: library_id
          in: query
          description: Si se indica, solo devuelve ítems de esa biblioteca.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: kind
          in: query
          description: Filtra por tipo de ítem.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
        - name: q
          in: query
          description: |
            Texto a buscar según `field`. Los caracteres `%` y `_` se tratan
            como literales. Sin `field`, busca en títulos, reparto, dirección y
            lema. El plegado de mayúsculas es ASCII: las letras acentuadas se
            encuentran escribiendo la misma grafía.
          required: false
          schema:
            type: string
        - name: field
          in: query
          description: |
            Campos de búsqueda de `q`: `all` (por defecto), `title`, `cast` o
            `director`.
          required: false
          schema:
            type: string
            enum:
              - all
              - title
              - cast
              - director
            default: all
        - name: letter
          in: query
          description: |
            Inicial del título visible, de A a Z o `#` para números y símbolos.
            Se ignoran signos de apertura y artículos iniciales; las tildes de
            la inicial y la Ñ se pliegan.
          required: false
          schema:
            type: string
        - name: genre
          in: query
          description: |
            Nombre exacto de un género, sin distinguir mayúsculas (plegado
            ASCII).
          required: false
          schema:
            type: string
        - name: watched
          in: query
          description: |
            Con `true`, solo ítems vistos por el usuario de la sesión; con
            `false`, solo los no vistos.
          required: false
          schema:
            type: boolean
        - name: in_progress
          in: query
          description: |
            Con `true`, solo ítems con progreso de reproducción del usuario de
            la sesión. Con `false`, solo los que no tienen progreso.
          required: false
          schema:
            type: boolean
        - name: collection_id
          in: query
          description: Si se indica, solo devuelve los ítems no excluidos de esa colección.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: series_id
          in: query
          description: Si se indica, solo devuelve los episodios de esa serie.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: unmatched
          in: query
          description: |
            Con `true`, devuelve solo películas sin identificar o marcadas como
            «no es ninguna». Con `false`, no aplica este filtro.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            Orden de la lista: `title` (título visible normalizado —sin
            artículos iniciales y con la inicial sin tilde—), `year` (año
            descendente, nulos al final) o `added` (últimos añadidos primero).
            Sin `sort`, se ordena por `id`.
          required: false
          schema:
            type: string
            enum:
              - title
              - year
              - added
        - name: limit
          in: query
          description: Número máximo de ítems a devolver.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Número de ítems a saltar.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
        '400':
          description: Parámetros de paginación, filtro u orden no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}:
    get:
      summary: Ficha de un ítem
      description: Devuelve una entrada de `media_items` por su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/similar:
    get:
      summary: Películas similares a un ítem
      description: |
        Devuelve películas parecidas a la indicada usando sus géneros,
        dirección, colección, reparto, año y nota. Solo se consideran
        candidatas con cartel y que compartan al menos un género, una
        persona de la dirección o un actor del reparto principal. No consulta
        servicios externos ni incluye clips. Requiere sesión y que el ítem sea
        una película.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        '200':
          description: Películas similares ordenadas por afinidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarItemsResponse'
        '400':
          description: Límite fuera de rango
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una película con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/progress:
    put:
      summary: Guarda el progreso de reproducción (cualquier usuario)
      description: |
        Guarda la posición del usuario de la sesión. Si `position_seconds`
        llega al 90 % de `duration_seconds` (con duración mayor que 0), el
        ítem se marca como visto y se borra el progreso. Si la posición es
        menor de 10 segundos, también se borra el progreso sin marcar visto.
        En cualquier otro caso se guarda o actualiza. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '204':
          description: Progreso guardado, actualizado o descartado
        '400':
          description: Cuerpo o valores no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Borra el progreso de reproducción (cualquier usuario)
      description: |
        Borra el progreso del usuario de la sesión para el ítem. Es idempotente:
        siempre responde 204 aunque no hubiera progreso. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Progreso borrado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identificador no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/watched:
    put:
      summary: Marca un ítem como visto (cualquier usuario)
      description: |
        Marca el ítem como visto para el usuario de la sesión y borra su
        progreso de reproducción. Es idempotente: repetir la petición no cambia
        el estado. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Ítem marcado como visto
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Desmarca un ítem como visto (cualquier usuario)
      description: |
        Quita la marca de visto del usuario de la sesión y borra su progreso de
        reproducción. Es idempotente. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Ítem desmarcado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/thumbnail:
    get:
      summary: Miniatura de un vídeo de biblioteca clips
      description: |
        Devuelve un fotograma JPEG generado con FFmpeg y guardado en caché. Solo
        está disponible para ítems de bibliotecas de tipo `clips`. La primera
        petición genera la miniatura; las siguientes reutilizan la caché y el
        ETag permite responder 304. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Miniatura JPEG
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=86400
            ETag:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: La miniatura no ha cambiado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ítem no encontrado, no es de una biblioteca clips o no se pudo generar la miniatura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Hay dos miniaturas generándose; se puede reintentar
          headers:
            Retry-After:
              schema:
                type: string
                example: '5'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/file-info:
    get:
      summary: Ficha técnica del archivo de vídeo
      description: |
        Analiza el archivo con ffprobe y devuelve el contenedor, tamaño, fecha
        de modificación, duración, pistas de vídeo, audio y subtítulos, y cómo
        se reproducirá en el reproductor web. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ficha técnica del archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo no está en disco
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: ffprobe no pudo analizar el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ffprobe no está disponible en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/preferences:
