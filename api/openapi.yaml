openapi: 3.0.3
info:
  title: Cinecat API
  version: 0.1.0
  description: |
    API REST de Cinecat, el servidor de una biblioteca de vídeo personal.
    Todas las rutas están versionadas bajo `/api/v1/`, de forma independiente
    de la versión del propio servidor. Los endpoints de biblioteca exigen una
    sesión válida enviada como `Authorization: Bearer <token>`.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Inicia sesión
      description: |
        Comprueba usuario y contraseña y devuelve un token de sesión de vida
        corta. Tras varios intentos fallidos seguidos, responde 429 con un
        bloqueo temporal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: Cierra la sesión actual
      description: Invalida el token enviado en la cabecera `Authorization`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión invalidada
        '401':
          description: Falta el token de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password:
    post:
      summary: Cambia la contraseña del usuario autenticado
      description: |
        Comprueba `current_password` contra la de la sesión actual y, si es
        correcta, la sustituye por `new_password`. No invalida la sesión
        actual; el resto de sesiones del mismo usuario sigue valiendo hasta
        que caduquen por su cuenta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          description: Petición no válida (contraseña nueva vacía o demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o `current_password` incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries:
    get:
      summary: Lista las bibliotecas
      description: Devuelve todas las bibliotecas dadas de alta, ordenadas por nombre.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bibliotecas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrariesResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crea una biblioteca (solo administradores)
      description: |
        Da de alta una biblioteca. La ruta debe existir y ser un directorio en
        el servidor. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Biblioteca creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Datos no válidos o ruta inexistente o que no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una biblioteca con esa ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}:
    delete:
      summary: Borra una biblioteca (solo administradores)
      description: |
        Borra la biblioteca y, en cascada, sus ítems de `media_items`. Requiere
        una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Biblioteca borrada
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una biblioteca con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/scan:
    post:
      summary: Escanea todas las bibliotecas (solo administradores)
      description: |
        Recorre todas las bibliotecas dadas de alta, analiza los nombres de los
        archivos de vídeo y actualiza `media_items` sin duplicar entradas. Es
        síncrono: la petición espera a que termine el escaneo completo, que
        puede tardar con bibliotecas grandes. Requiere una sesión con rol
        `admin`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resultado del escaneo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno durante el escaneo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items:
    get:
      summary: Lista los ítems de las bibliotecas
      description: |
        Devuelve las entradas de `media_items` con paginación simple. El orden
        es estable por `id`.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Número máximo de ítems a devolver.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Número de ítems a saltar.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
        '400':
          description: Parámetros de paginación no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}:
    get:
      summary: Ficha de un ítem
      description: Devuelve una entrada de `media_items` por su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/play:
    get:
      summary: Prepara la reproducción de un ítem
      description: |
        Elige entre reproducción directa (el contenedor se puede servir tal
        cual) y remux a HLS fMP4 (sin recodificar), y devuelve una URL firmada
        de vida corta. La URL apunta a `/api/v1/stream/...` y no requiere la
        cabecera de sesión: la autorización es la propia firma.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: URL de reproducción preparada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Contenedor no soportado para reproducción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}:
    get:
      summary: Sirve el archivo directo o la playlist remux
      description: |
        Endpoint de las URLs firmadas. Con modo directo sirve el archivo con
        soporte de rangos HTTP; con modo remux sirve la playlist HLS. Una firma
        ausente, manipulada o caducada se rechaza con 403.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo o playlist
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '206':
          description: Parte del archivo directo (petición con Range)
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}/{file}:
    get:
      summary: Sirve la playlist, el init o un segmento del remux
      description: |
        Archivos del remux HLS fMP4: `playlist.m3u8`, `init.mp4` o
        `segment_XXXXX.m4s`. La playlist que se entrega lleva la firma en las
        URLs de sus segmentos.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: file
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo del remux
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nombre de archivo no válido o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    StreamId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    SignatureExp:
      name: exp
      in: query
      required: true
      description: Caducidad de la URL, en segundos desde la época Unix.
      schema:
        type: integer
        format: int64
    Signature:
      name: sig
      in: query
      required: true
      description: Firma HMAC-SHA256 del ítem y la caducidad.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error para el cliente.
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false
    LoginResponse:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          description: Token de sesión en claro; no se vuelve a poder consultar.
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    Library:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
      additionalProperties: false
    LibrariesResponse:
      type: object
      required:
        - libraries
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
      additionalProperties: false
    CreateLibraryRequest:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Ruta existente y que sea un directorio en el servidor.
      additionalProperties: false
    ScanResult:
      type: object
      required:
        - libraries
        - files
        - upserted
        - warnings
      properties:
        libraries:
          type: integer
          description: Bibliotecas recorridas.
        files:
          type: integer
          description: Archivos de vídeo encontrados.
        upserted:
          type: integer
          description: Entradas de `media_items` creadas o actualizadas.
        warnings:
          type: array
          description: Rutas ilegibles o bibliotecas inexistentes que no abortaron el escaneo.
          items:
            type: string
      additionalProperties: false
    MediaItem:
      type: object
      required:
        - id
        - library_id
        - path
        - title
        - year
        - kind
        - season
        - episode
        - tmdb_id
      properties:
        id:
          type: integer
          format: int64
        library_id:
          type: integer
          format: int64
        path:
          type: string
        title:
          type: string
        year:
          type: integer
          nullable: true
        kind:
          type: string
          enum:
            - movie
            - series
            - episode
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        tmdb_id:
          type: integer
          format: int64
          nullable: true
      additionalProperties: false
    ItemsResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    PlayResponse:
      type: object
      required:
        - url
        - mode
        - expires_at
      properties:
        url:
          type: string
          description: |
            URL relativa firmada. Para modo directo apunta al archivo; para
            remux, a la playlist HLS.
        mode:
          type: string
          enum:
            - direct
            - remux
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
