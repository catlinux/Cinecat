openapi: 3.0.3
info:
  title: Cinecat API
  version: 0.1.0
  description: |
    API REST de Cinecat, el servidor de una biblioteca de vídeo personal.
    Todas las rutas están versionadas bajo `/api/v1/`, de forma independiente
    de la versión del propio servidor. Los endpoints de biblioteca exigen una
    sesión válida enviada como `Authorization: Bearer <token>`.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Inicia sesión
      description: |
        Comprueba usuario y contraseña y devuelve un token de sesión de vida
        corta. Tras varios intentos fallidos seguidos, responde 429 con un
        bloqueo temporal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: Cierra la sesión actual
      description: Invalida el token enviado en la cabecera `Authorization`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión invalidada
        '401':
          description: Falta el token de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      summary: Devuelve el usuario de la sesión actual
      description: |
        Permite al cliente saber quién está autenticado y con qué rol, sin
        decodificar nada del lado cliente (el token es opaco).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password:
    post:
      summary: Cambia la contraseña del usuario autenticado
      description: |
        Comprueba `current_password` contra la de la sesión actual y, si es
        correcta, la sustituye por `new_password`. No invalida la sesión
        actual; el resto de sesiones del mismo usuario sigue valiendo hasta
        que caduquen por su cuenta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          description: Petición no válida (contraseña nueva vacía o demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o `current_password` incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system/version:
    get:
      summary: Devuelve la versión del servidor
      description: |
        Informa de la versión compilada del servidor, el commit y la fecha de
        compilación. No exige sesión: la web lo usa para mostrar el pie y
        avisar si su propia versión no coincide.
      security: []
      responses:
        '200':
          description: Versión del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerVersion'
  /api/v1/libraries:
    get:
      summary: Lista las bibliotecas
      description: Devuelve todas las bibliotecas dadas de alta, ordenadas por nombre.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bibliotecas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrariesResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crea una biblioteca (solo administradores)
      description: |
        Da de alta una biblioteca. La ruta debe existir y ser un directorio en
        el servidor. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Biblioteca creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Datos no válidos o ruta inexistente o que no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una biblioteca con esa ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}:
    delete:
      summary: Borra una biblioteca (solo administradores)
      description: |
        Borra la biblioteca y, en cascada, sus ítems de `media_items`. Requiere
        una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Biblioteca borrada
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una biblioteca con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/scan:
    post:
      summary: Inicia un escaneo en segundo plano (solo administradores)
      description: |
        Recorre todas las bibliotecas dadas de alta, analiza los nombres de los
        archivos de vídeo y actualiza `media_items` sin duplicar entradas. La
        respuesta vuelve en cuanto arranca el escaneo; el progreso y el
        resultado se consultan con `GET /api/v1/libraries/scan`. Si ya hay uno
        en marcha, responde 409. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Escaneo iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStarted'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay un escaneo en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Consulta el estado del escaneo (solo administradores)
      description: |
        Devuelve el estado del último escaneo, o el del que está en marcha.
        Mientras corre, `finished_at` es `null`; al terminar se conserva el
        resultado hasta el siguiente escaneo. Requiere una sesión con rol
        `admin`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del escaneo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/genres:
    get:
      summary: Lista los géneros con su número de ítems
      description: |
        Devuelve los géneros de los ítems del tipo indicado, ordenados por
        nombre, con el número de ítems distintos de cada uno. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          description: Tipo de ítem del que contar géneros.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
            default: movie
      responses:
        '200':
          description: Géneros y conteos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenresResponse'
        '400':
          description: Tipo de ítem no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/home:
    get:
      summary: Datos del portal para el usuario de la sesión
      description: |
        Devuelve «continuar viendo», «añadido recientemente» y contadores del
        catálogo. `continue` incluye películas y episodios con progreso del
        usuario, ordenados por la última actualización y limitados a 20.
        `next_up` queda vacío hasta que existan las series como entidad.
        `recent_movies` son las 20 últimas películas añadidas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections:
    get:
      summary: Lista las colecciones visibles
      description: |
        Devuelve las colecciones no borradas y visibles: las manuales siempre y
        las de TMDB con al menos dos películas no excluidas. Las automáticas
        ocultas no aparecen. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 48
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          description: Texto a buscar en el nombre, sin distinguir mayúsculas.
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - added
              - size
            default: name
      responses:
        '200':
          description: Página de colecciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '400':
          description: Parámetros no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crea una colección manual (solo administradores)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Colección creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Datos no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      summary: Detalle de una colección
      description: |
        Devuelve la colección y sus películas no excluidas ordenadas por
        posición y, si no tienen posición, por año e id. Las automáticas con
        menos de dos películas se ocultan. Requiere sesión.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la colección
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetail'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección no existe, está borrada u oculta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Edita una colección (solo administradores)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: Colección actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Datos no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Borra una colección (solo administradores)
      description: |
        Las manuales se eliminan y las de TMDB se marcan como borradas para que
        no reaparezcan.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Colección borrada
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections/{id}/items:
    post:
      summary: Añade una película a una colección (solo administradores)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionItemRequest'
      responses:
        '204':
          description: Película añadida
        '400':
          description: El ítem no es una película o los datos no son válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección o la película no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections/{id}/items/{itemId}:
    delete:
      summary: Quita una película de una colección (solo administradores)
      description: |
        En colecciones manuales borra la pertenencia. En las de TMDB marca la
        película como excluida y la colección como editada.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Película quitada o excluida
        '400':
          description: El ítem no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección o la película no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections/{id}/order:
    put:
      summary: Reordena las películas de una colección (solo administradores)
      description: |
        La lista debe contener exactamente las películas no excluidas de la
        colección, sin repetidos. En las colecciones de TMDB marca la colección
        como editada.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionOrderRequest'
      responses:
        '204':
          description: Orden actualizado
        '400':
          description: La lista no coincide exactamente con los miembros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La colección no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items:
    get:
      summary: Lista los ítems de las bibliotecas
      description: |
        Devuelve las entradas de `media_items` con paginación simple. Los
        filtros se pueden combinar. Sin `sort`, el orden es estable por `id`.
      security:
        - bearerAuth: []
      parameters:
        - name: library_id
          in: query
          description: Si se indica, solo devuelve ítems de esa biblioteca.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: kind
          in: query
          description: Filtra por tipo de ítem.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
        - name: q
          in: query
          description: |
            Texto a buscar según `field`. Los caracteres `%` y `_` se tratan
            como literales. Sin `field`, busca en títulos, reparto, dirección y
            lema. El plegado de mayúsculas es ASCII: las letras acentuadas se
            encuentran escribiendo la misma grafía.
          required: false
          schema:
            type: string
        - name: field
          in: query
          description: |
            Campos de búsqueda de `q`: `all` (por defecto), `title`, `cast` o
            `director`.
          required: false
          schema:
            type: string
            enum:
              - all
              - title
              - cast
              - director
            default: all
        - name: letter
          in: query
          description: |
            Inicial del título visible, de A a Z o `#` para números y símbolos.
            Se ignoran signos de apertura y artículos iniciales; las tildes de
            la inicial y la Ñ se pliegan.
          required: false
          schema:
            type: string
        - name: genre
          in: query
          description: |
            Nombre exacto de un género, sin distinguir mayúsculas (plegado
            ASCII).
          required: false
          schema:
            type: string
        - name: watched
          in: query
          description: |
            Con `true`, solo ítems vistos por el usuario de la sesión; con
            `false`, solo los no vistos.
          required: false
          schema:
            type: boolean
        - name: in_progress
          in: query
          description: |
            Con `true`, solo ítems con progreso de reproducción del usuario de
            la sesión. Con `false`, solo los que no tienen progreso.
          required: false
          schema:
            type: boolean
        - name: collection_id
          in: query
          description: Si se indica, solo devuelve los ítems no excluidos de esa colección.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: series_id
          in: query
          description: Si se indica, solo devuelve los episodios de esa serie.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: unmatched
          in: query
          description: |
            Con `true`, devuelve solo películas sin identificar o marcadas como
            «no es ninguna». Con `false`, no aplica este filtro.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            Orden de la lista: `title` (título visible normalizado —sin
            artículos iniciales y con la inicial sin tilde—), `year` (año
            descendente, nulos al final) o `added` (últimos añadidos primero).
            Sin `sort`, se ordena por `id`.
          required: false
          schema:
            type: string
            enum:
              - title
              - year
              - added
        - name: limit
          in: query
          description: Número máximo de ítems a devolver.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Número de ítems a saltar.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
        '400':
          description: Parámetros de paginación, filtro u orden no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}:
    get:
      summary: Ficha de un ítem
      description: Devuelve una entrada de `media_items` por su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/similar:
    get:
      summary: Películas similares a un ítem
      description: |
        Devuelve películas parecidas a la indicada usando sus géneros,
        dirección, colección, reparto, año y nota. Solo se consideran
        candidatas con cartel y que compartan al menos un género, una
        persona de la dirección o un actor del reparto principal. No consulta
        servicios externos. Requiere sesión y que el ítem sea una película.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        '200':
          description: Películas similares ordenadas por afinidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarItemsResponse'
        '400':
          description: Límite fuera de rango
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una película con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/progress:
    put:
      summary: Guarda el progreso de reproducción (cualquier usuario)
      description: |
        Guarda la posición del usuario de la sesión. Si `position_seconds`
        llega al 90 % de `duration_seconds` (con duración mayor que 0), el
        ítem se marca como visto y se borra el progreso. Si la posición es
        menor de 10 segundos, también se borra el progreso sin marcar visto.
        En cualquier otro caso se guarda o actualiza. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '204':
          description: Progreso guardado, actualizado o descartado
        '400':
          description: Cuerpo o valores no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Borra el progreso de reproducción (cualquier usuario)
      description: |
        Borra el progreso del usuario de la sesión para el ítem. Es idempotente:
        siempre responde 204 aunque no hubiera progreso. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Progreso borrado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identificador no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/watched:
    put:
      summary: Marca un ítem como visto (cualquier usuario)
      description: |
        Marca el ítem como visto para el usuario de la sesión y borra su
        progreso de reproducción. Es idempotente: repetir la petición no cambia
        el estado. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
