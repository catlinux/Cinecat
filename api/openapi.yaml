              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/settings:
    get:
      summary: Lista los ajustes del servidor
      description: |
        Devuelve todos los ajustes agrupados por sección, con su valor
        efectivo, su valor por defecto, sus opciones y si tienen un valor
        guardado distinto del defecto. Solo para administradores.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ajustes disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Cambia varios ajustes
      description: |
        Valida todas las claves y valores antes de guardar nada. Si alguna
        clave es desconocida o su valor no es válido, no se aplica ningún
        cambio y se devuelven los mensajes por clave en `fields`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Objeto con las claves de ajuste que se cambian.
              additionalProperties: true
      responses:
        '200':
          description: Ajustes actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: Algún ajuste es desconocido o no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsError'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/settings/{key}:
    delete:
      summary: Restablece un ajuste
      description: Borra el valor guardado y devuelve el ajuste con su defecto.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Clave del ajuste, por ejemplo `ui.page_size`.
          schema:
            type: string
      responses:
        '200':
          description: Ajuste restablecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setting'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La clave no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/settings/public:
    get:
      summary: Devuelve los ajustes públicos
      description: |
        Devuelve un objeto plano con los ajustes que la interfaz puede
        consultar sin ser administrador.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ajustes públicos efectivos
          content:
            application/json:
              schema:
                type: object
                description: Clave de ajuste y su valor efectivo.
                additionalProperties: true
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ImageKind:
      name: kind
      in: path
      required: true
      description: Tipo de imagen que se fija o se restaura.
      schema:
        type: string
        enum:
          - poster
          - backdrop
    ItemId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    StreamId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    SignatureExp:
      name: exp
      in: query
      required: true
      description: Caducidad de la URL, en segundos desde la época Unix.
      schema:
        type: integer
        format: int64
    Signature:
      name: sig
      in: query
      required: true
      description: Firma HMAC-SHA256 del ítem y la caducidad.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error para el cliente.
      additionalProperties: false
    ServerVersion:
      type: object
      required:
        - server
        - commit
        - built_at
      properties:
        server:
          type: string
          description: Versión del servidor, tomada del archivo VERSION al compilar.
        commit:
          type: string
          description: Hash corto del commit de la compilación; vacío si no se inyectó.
        built_at:
          type: string
          description: Fecha UTC de la compilación en RFC3339; vacía si no se inyectó.
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false
    LoginResponse:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          description: Token de sesión en claro; no se vuelve a poder consultar.
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    CurrentUserResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - user
      additionalProperties: false
    Library:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
      additionalProperties: false
    LibrariesResponse:
      type: object
      required:
        - libraries
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
      additionalProperties: false
    CreateLibraryRequest:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Ruta existente y que sea un directorio en el servidor.
      additionalProperties: false
    ScanStarted:
      type: object
      required:
        - started
      properties:
        started:
          type: boolean
          description: Indica que el escaneo se ha lanzado.
      additionalProperties: false
    ScanStatus:
      type: object
      required:
        - running
        - started_at
        - finished_at
        - libraries
        - files
        - upserted
        - identified
        - unidentified
        - warnings
        - error
      properties:
        running:
          type: boolean
          description: Hay un escaneo en marcha.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Inicio del escaneo en UTC; `null` si aún no se ha lanzado ninguno.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Fin del escaneo en UTC; `null` mientras corre o si aún no se ha lanzado ninguno.
        libraries:
          type: integer
          description: Bibliotecas recorridas.
        files:
          type: integer
          description: Archivos de vídeo encontrados.
        upserted:
          type: integer
          description: Entradas de `media_items` creadas o actualizadas.
        identified:
          type: integer
          description: Películas identificadas con TMDB en este escaneo.
        unidentified:
          type: integer
          description: Películas consultadas sin coincidencia.
        warnings:
          type: array
          description: Avisos que no abortaron el escaneo. Siempre es un array, aunque esté vacío.
          items:
            type: string
        error:
          type: string
          description: Mensaje del error que detuvo el escaneo; vacío si terminó bien.
      additionalProperties: false
    Candidate:
      type: object
      required:
        - tmdb_id
        - title
        - original_title
        - year
        - overview
        - poster_url
        - popularity
        - vote_count
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        original_title:
          type: string
        year:
          type: integer
        overview:
          type: string
        poster_url:
          type: string
        popularity:
          type: number
          format: double
        vote_count:
          type: integer
      additionalProperties: false
    CandidatesResponse:
      type: object
      required:
        - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
      additionalProperties: false
    UpdateMatchRequest:
      type: object
      required:
        - tmdb_id
      properties:
        tmdb_id:
          type: integer
          nullable: true
          description: Identificador de TMDB, o null para «no es ninguna».
      additionalProperties: false
    GenreCount:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
        count:
          type: integer
      additionalProperties: false
    GenresResponse:
      type: object
      required:
        - genres
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreCount'
      additionalProperties: false
    PlaybackInfo:
      type: object
      required:
        - mode
        - description
        - supported
      properties:
        mode:
          type: string
          enum:
            - direct
            - hls
            - ''
          description: Modo de reproducción; vacío si el contenedor no está soportado.
        description:
          type: string
        supported:
          type: boolean
      additionalProperties: false
    VideoStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - width
        - height
        - display_aspect_ratio
        - frame_rate
        - bit_rate
        - pixel_format
        - bit_depth
        - hdr
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        width:
          type: integer
        height:
          type: integer
        display_aspect_ratio:
          type: string
        frame_rate:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        pixel_format:
          type: string
        bit_depth:
          type: integer
        hdr:
          type: string
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    AudioStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - channels
        - channel_layout
        - sample_rate
        - bit_rate
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        channels:
          type: integer
        channel_layout:
          type: string
        sample_rate:
          type: integer
        bit_rate:
          type: integer
          format: int64
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    SubtitleStream:
      type: object
      required:
        - index
        - codec
        - language
        - title
        - forced
        - default
        - text
      properties:
        index:
          type: integer
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        default:
          type: boolean
        text:
          type: boolean
      additionalProperties: false
    FileInfo:
      type: object
      required:
        - container
        - container_long_name
        - size_bytes
        - duration_seconds
        - bit_rate
        - modified_at
        - file_name
        - video
        - audio
        - subtitles
        - chapters
        - quality
      properties:
        container:
          type: string
        container_long_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        modified_at:
          type: string
          format: date-time
        file_name:
          type: string
        video:
