        - photo_url
      properties:
        name:
          type: string
        job:
          type: string
          description: Trabajo realizado, por ejemplo Director, Writer o Creator.
        photo_url:
          type: string
          description: URL de la foto o cadena vacía si no hay.
      additionalProperties: false
    Credits:
      type: object
      required:
        - cast
        - crew
      properties:
        cast:
          type: array
          description: Reparto principal; siempre un array, aunque esté vacío.
          items:
            $ref: '#/components/schemas/CastCredit'
        crew:
          type: array
          description: Equipo principal; siempre un array, aunque esté vacío.
          items:
            $ref: '#/components/schemas/CrewCredit'
      additionalProperties: false
    Series:
      type: object
      required:
