        duration_seconds:
          type: number
          format: double
          minimum: 0
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    ProgressRequest:
      type: object
      required:
        - position_seconds
        - duration_seconds
      properties:
        position_seconds:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: number
          format: double
          minimum: 0
      additionalProperties: false
    HomeCounts:
      type: object
      required:
        - movies
        - episodes
        - series
      properties:
        movies:
          type: integer
          format: int64
        episodes:
          type: integer
          format: int64
        series:
          type: integer
          format: int64
      additionalProperties: false
    HomeResponse:
