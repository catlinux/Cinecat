              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/file-info:
    get:
      summary: Ficha técnica del archivo de vídeo
      description: |
