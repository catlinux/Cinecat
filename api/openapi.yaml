openapi: 3.0.3
info:
  title: Cinecat API
  version: 0.1.0
  description: |
    API REST de Cinecat, el servidor de una biblioteca de vídeo personal.
    Todas las rutas están versionadas bajo `/api/v1/`, de forma independiente
    de la versión del propio servidor. Los endpoints de biblioteca exigen una
    sesión válida enviada como `Authorization: Bearer <token>`.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Inicia sesión
      description: |
        Comprueba usuario y contraseña y devuelve un token de sesión de vida
        corta. Tras varios intentos fallidos seguidos, responde 429 con un
        bloqueo temporal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: Cierra la sesión actual
      description: Invalida el token enviado en la cabecera `Authorization`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión invalidada
        '401':
          description: Falta el token de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      summary: Devuelve el usuario de la sesión actual
      description: |
        Permite al cliente saber quién está autenticado y con qué rol, sin
        decodificar nada del lado cliente (el token es opaco).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password:
    post:
      summary: Cambia la contraseña del usuario autenticado
      description: |
        Comprueba `current_password` contra la de la sesión actual y, si es
        correcta, la sustituye por `new_password`. No invalida la sesión
        actual; el resto de sesiones del mismo usuario sigue valiendo hasta
        que caduquen por su cuenta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          description: Petición no válida (contraseña nueva vacía o demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o `current_password` incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system/version:
    get:
      summary: Devuelve la versión del servidor
      description: |
        Informa de la versión compilada del servidor, el commit y la fecha de
        compilación. No exige sesión: la web lo usa para mostrar el pie y
        avisar si su propia versión no coincide.
      security: []
      responses:
        '200':
          description: Versión del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerVersion'
  /api/v1/system/update:
    get:
      summary: Estado de las actualizaciones (solo administradores)
      description: |
        Con `system.check_updates` activo consulta GitHub si la caché ha
        caducado; con el ajuste apagado devuelve únicamente la última
        comprobación conocida, si la hay.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado de actualización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system/update/check:
    post:
      summary: Fuerza la comprobación de actualizaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resultado de la comprobación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar GitHub
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system/update/apply:
    post:
      summary: Solicita la actualización a la última versión conocida
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplyRequest'
      responses:
        '202':
          description: Petición de actualización aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
        '400':
          description: Etiqueta no válida o no es la última versión conocida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay una actualización en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: La actualización automática no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries:
    get:
      summary: Lista las bibliotecas
      description: |
        Devuelve todas las bibliotecas dadas de alta, ordenadas por nombre, con
        su tipo, sus carpetas y el número de ítems.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bibliotecas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrariesResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crea una biblioteca (solo administradores)
      description: |
        Da de alta una biblioteca. La ruta debe existir y ser un directorio en
        el servidor. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Biblioteca creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Datos no válidos o ruta inexistente o que no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una biblioteca con esa ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}:
    delete:
      summary: Borra una biblioteca (solo administradores)
      description: |
        Borra la biblioteca y, en cascada, sus ítems de `media_items`. Requiere
        una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Biblioteca borrada
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una biblioteca con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Cambia el nombre de una biblioteca (solo administradores)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibraryRequest'
      responses:
        '200':
          description: Biblioteca actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Nombre no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Biblioteca no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}/paths:
    post:
      summary: Añade una carpeta a una biblioteca (solo administradores)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryPathRequest'
      responses:
        '201':
          description: Carpeta añadida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Ruta no válida, inexistente, fuera de las raíces o no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Biblioteca no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La carpeta ya está registrada o se solapa con otra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}/paths/{pathId}:
    delete:
      summary: Quita una carpeta de una biblioteca (solo administradores)
      description: |
        Borra de la base los ítems que cuelgan de la carpeta y limpia series y
        colecciones huérfanas. No toca los archivos del disco. La última carpeta
        de una biblioteca no se puede quitar.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: pathId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Carpeta quitada
        '400':
          description: Es la única carpeta de la biblioteca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Biblioteca o carpeta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/fs:
    get:
      summary: Navega por las carpetas permitidas del servidor (solo administradores)
      description: |
        Sin `path` devuelve las raíces permitidas. Con `path` devuelve solo
        directorios, sin entradas ocultas ni `.cinecat-papelera`, con un máximo
        de 1000. Las rutas se confinan a `CINECAT_MEDIA_ROOTS`.
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Raíces o contenido de una carpeta
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FSRootsResponse'
                  - $ref: '#/components/schemas/FSBrowseResponse'
        '400':
          description: Ruta relativa, con «..» o que no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Ruta fuera de las raíces permitidas o usuario sin rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ruta inexistente o no legible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}/browse:
    get:
      summary: Navega por las carpetas de una biblioteca de vídeos
      description: |
        Solo para bibliotecas de tipo `clips`. Sin `root`, devuelve las carpetas
        de la biblioteca como entradas de primer nivel, sin rutas absolutas. Con
        `root` (id de una carpeta de la biblioteca) y `path` relativa, devuelve
        las subcarpetas que contienen vídeos y los ítems de la carpeta actual.
        Se calcula a partir de la base de datos, no recorre el disco.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: root
          in: query
          required: false
          description: Identificador de la carpeta raíz dentro de la biblioteca.
          schema:
            type: integer
            format: int64
        - name: path
          in: query
          required: false
          description: Ruta relativa a la raíz; vacía para la raíz.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Carpetas de la biblioteca o contenido de una carpeta
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClipRootsResponse'
                  - $ref: '#/components/schemas/ClipBrowseResponse'
        '400':
          description: root no válido o ruta absoluta, con «..» o componentes vacíos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La biblioteca no existe, no es de tipo clips o la carpeta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/scan:
    post:
      summary: Inicia un escaneo en segundo plano (solo administradores)
      description: |
        Recorre todas las carpetas de las bibliotecas de tipo `video` y `clips`,
        analiza los nombres de los archivos y actualiza `media_items` sin
        duplicar entradas. Las bibliotecas `video` pueden identificarse con
        metadatos externos; las de `clips` nunca hacen peticiones a TMDB ni OMDb
        y guardan el título a partir del nombre del archivo. La música todavía
        se omite con un aviso. Si una carpeta no está disponible, conserva sus
        fichas y avisa en el resultado. La respuesta vuelve en cuanto arranca el
        escaneo; el progreso y el resultado se consultan con
        `GET /api/v1/libraries/scan`. Si ya hay uno en marcha, responde 409.
        Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Escaneo iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStarted'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay un escaneo en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Consulta el estado del escaneo (solo administradores)
      description: |
        Devuelve el estado del último escaneo, o el del que está en marcha.
        Mientras corre, `finished_at` es `null`; al terminar se conserva el
        resultado hasta el siguiente escaneo. Requiere una sesión con rol
        `admin`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del escaneo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/genres:
    get:
      summary: Lista los géneros con su número de ítems
      description: |
        Devuelve los géneros de los ítems de bibliotecas `video` del tipo
        indicado, ordenados por nombre, con el número de ítems distintos de cada
        uno. Los clips no se incluyen. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          description: Tipo de ítem del que contar géneros.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
            default: movie
      responses:
        '200':
          description: Géneros y conteos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenresResponse'
        '400':
          description: Tipo de ítem no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/home:
    get:
      summary: Datos del portal para el usuario de la sesión
      description: |
        Devuelve «continuar viendo», «añadido recientemente» y contadores del
        catálogo. `continue` incluye películas y episodios con progreso del
        usuario, ordenados por la última actualización y limitados a 20.
        `next_up` incluye el siguiente episodio por ver de cada serie, con el
        nombre de la serie, el fotograma y los carteles de la serie.
        `recent_movies` son las 20 últimas películas añadidas.
        `recent_series` son las 20 últimas series con episodios, por fecha de alta.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/collections:
    get:
      summary: Lista las colecciones visibles
      description: |
        Devuelve las colecciones no borradas y visibles: las manuales siempre y
        las de TMDB con al menos dos películas no excluidas. Las automáticas
        ocultas no aparecen. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 48
