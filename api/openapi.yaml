openapi: 3.0.3
info:
  title: Cinecat API
  version: 0.1.0
  description: |
    API REST de Cinecat, el servidor de una biblioteca de vídeo personal.
    Todas las rutas están versionadas bajo `/api/v1/`, de forma independiente
    de la versión del propio servidor. Los endpoints de biblioteca exigen una
    sesión válida enviada como `Authorization: Bearer <token>`.
servers:
  - url: /
paths:
  /api/v1/auth/login:
    post:
      summary: Inicia sesión
      description: |
        Comprueba usuario y contraseña y devuelve un token de sesión de vida
        corta. Tras varios intentos fallidos seguidos, responde 429 con un
        bloqueo temporal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Petición no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Usuario o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      summary: Cierra la sesión actual
      description: Invalida el token enviado en la cabecera `Authorization`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión invalidada
        '401':
          description: Falta el token de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/me:
    get:
      summary: Devuelve el usuario de la sesión actual
      description: |
        Permite al cliente saber quién está autenticado y con qué rol, sin
        decodificar nada del lado cliente (el token es opaco).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password:
    post:
      summary: Cambia la contraseña del usuario autenticado
      description: |
        Comprueba `current_password` contra la de la sesión actual y, si es
        correcta, la sustituye por `new_password`. No invalida la sesión
        actual; el resto de sesiones del mismo usuario sigue valiendo hasta
        que caduquen por su cuenta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña actualizada
        '400':
          description: Petición no válida (contraseña nueva vacía o demasiado corta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o `current_password` incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/system/version:
    get:
      summary: Devuelve la versión del servidor
      description: |
        Informa de la versión compilada del servidor, el commit y la fecha de
        compilación. No exige sesión: la web lo usa para mostrar el pie y
        avisar si su propia versión no coincide.
      security: []
      responses:
        '200':
          description: Versión del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerVersion'
  /api/v1/libraries:
    get:
      summary: Lista las bibliotecas
      description: Devuelve todas las bibliotecas dadas de alta, ordenadas por nombre.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bibliotecas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrariesResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crea una biblioteca (solo administradores)
      description: |
        Da de alta una biblioteca. La ruta debe existir y ser un directorio en
        el servidor. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Biblioteca creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Datos no válidos o ruta inexistente o que no es un directorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una biblioteca con esa ruta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/{id}:
    delete:
      summary: Borra una biblioteca (solo administradores)
      description: |
        Borra la biblioteca y, en cascada, sus ítems de `media_items`. Requiere
        una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Biblioteca borrada
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe una biblioteca con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/libraries/scan:
    post:
      summary: Inicia un escaneo en segundo plano (solo administradores)
      description: |
        Recorre todas las bibliotecas dadas de alta, analiza los nombres de los
        archivos de vídeo y actualiza `media_items` sin duplicar entradas. La
        respuesta vuelve en cuanto arranca el escaneo; el progreso y el
        resultado se consultan con `GET /api/v1/libraries/scan`. Si ya hay uno
        en marcha, responde 409. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Escaneo iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStarted'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya hay un escaneo en curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Consulta el estado del escaneo (solo administradores)
      description: |
        Devuelve el estado del último escaneo, o el del que está en marcha.
        Mientras corre, `finished_at` es `null`; al terminar se conserva el
        resultado hasta el siguiente escaneo. Requiere una sesión con rol
        `admin`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del escaneo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatus'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/genres:
    get:
      summary: Lista los géneros con su número de ítems
      description: |
        Devuelve los géneros de los ítems del tipo indicado, ordenados por
        nombre, con el número de ítems distintos de cada uno. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          description: Tipo de ítem del que contar géneros.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
            default: movie
      responses:
        '200':
          description: Géneros y conteos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenresResponse'
        '400':
          description: Tipo de ítem no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/home:
    get:
      summary: Datos del portal para el usuario de la sesión
      description: |
        Devuelve «continuar viendo», «añadido recientemente» y contadores del
        catálogo. `continue` incluye películas y episodios con progreso del
        usuario, ordenados por la última actualización y limitados a 20.
        `next_up` queda vacío hasta que existan las series como entidad.
        `recent_movies` son las 20 últimas películas añadidas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items:
    get:
      summary: Lista los ítems de las bibliotecas
      description: |
        Devuelve las entradas de `media_items` con paginación simple. Los
        filtros se pueden combinar. Sin `sort`, el orden es estable por `id`.
      security:
        - bearerAuth: []
      parameters:
        - name: library_id
          in: query
          description: Si se indica, solo devuelve ítems de esa biblioteca.
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: kind
          in: query
          description: Filtra por tipo de ítem.
          required: false
          schema:
            type: string
            enum:
              - movie
              - episode
        - name: q
          in: query
          description: |
            Texto a buscar según `field`. Los caracteres `%` y `_` se tratan
            como literales. Sin `field`, busca en títulos, reparto, dirección y
            lema. El plegado de mayúsculas es ASCII: las letras acentuadas se
            encuentran escribiendo la misma grafía.
          required: false
          schema:
            type: string
        - name: field
          in: query
          description: |
            Campos de búsqueda de `q`: `all` (por defecto), `title`, `cast` o
            `director`.
          required: false
          schema:
            type: string
            enum:
              - all
              - title
              - cast
              - director
            default: all
        - name: letter
          in: query
          description: |
            Inicial del título visible, de A a Z o `#` para números y símbolos.
            Se ignoran signos de apertura y artículos iniciales; las tildes de
            la inicial y la Ñ se pliegan.
          required: false
          schema:
            type: string
        - name: genre
          in: query
          description: |
            Nombre exacto de un género, sin distinguir mayúsculas (plegado
            ASCII).
          required: false
          schema:
            type: string
        - name: watched
          in: query
          description: |
            Con `true`, solo ítems vistos por el usuario de la sesión; con
            `false`, solo los no vistos.
          required: false
          schema:
            type: boolean
        - name: in_progress
          in: query
          description: |
            Con `true`, solo ítems con progreso de reproducción del usuario de
            la sesión. Con `false`, solo los que no tienen progreso.
          required: false
          schema:
            type: boolean
        - name: unmatched
          in: query
          description: |
            Con `true`, devuelve solo películas sin identificar o marcadas como
            «no es ninguna». Con `false`, no aplica este filtro.
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            Orden de la lista: `title` (título visible normalizado —sin
            artículos iniciales y con la inicial sin tilde—), `year` (año
            descendente, nulos al final) o `added` (últimos añadidos primero).
            Sin `sort`, se ordena por `id`.
          required: false
          schema:
            type: string
            enum:
              - title
              - year
              - added
        - name: limit
          in: query
          description: Número máximo de ítems a devolver.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Número de ítems a saltar.
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
        '400':
          description: Parámetros de paginación, filtro u orden no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}:
    get:
      summary: Ficha de un ítem
      description: Devuelve una entrada de `media_items` por su identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/progress:
    put:
      summary: Guarda el progreso de reproducción (cualquier usuario)
      description: |
        Guarda la posición del usuario de la sesión. Si `position_seconds`
        llega al 90 % de `duration_seconds` (con duración mayor que 0), el
        ítem se marca como visto y se borra el progreso. Si la posición es
        menor de 10 segundos, también se borra el progreso sin marcar visto.
        En cualquier otro caso se guarda o actualiza. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '204':
          description: Progreso guardado, actualizado o descartado
        '400':
          description: Cuerpo o valores no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un ítem con ese identificador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Borra el progreso de reproducción (cualquier usuario)
      description: |
        Borra el progreso del usuario de la sesión para el ítem. Es idempotente:
        siempre responde 204 aunque no hubiera progreso. Requiere sesión.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Progreso borrado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identificador no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/watched:
    put:
      summary: Marca un ítem como visto (cualquier usuario)
      description: |
        Marca el ítem como visto para el usuario de la sesión y borra su
        progreso de reproducción. Es idempotente: repetir la petición no cambia
        el estado. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Ítem marcado como visto
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Desmarca un ítem como visto (cualquier usuario)
      description: |
        Quita la marca de visto del usuario de la sesión y borra su progreso de
        reproducción. Es idempotente. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Ítem desmarcado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/file-info:
    get:
      summary: Ficha técnica del archivo de vídeo
      description: |
        Analiza el archivo con ffprobe y devuelve el contenedor, tamaño, fecha
        de modificación, duración, pistas de vídeo, audio y subtítulos, y cómo
        se reproducirá en el reproductor web. Requiere una sesión válida.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ficha técnica del archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfoResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo no está en disco
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: ffprobe no pudo analizar el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: ffprobe no está disponible en el servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/candidates:
    get:
      summary: Busca candidatos de TMDB para una película (solo administradores)
      description: |
        Busca películas en TMDB. Si no se indica `q`, usa el título analizado
        del archivo. `year` es opcional. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: q
          in: query
          description: Texto a buscar; por defecto, el título analizado del archivo.
          required: false
          schema:
            type: string
        - name: year
          in: query
          description: Año opcional para afinar la búsqueda.
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Candidatos encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'
        '400':
          description: Parámetros no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/match:
    put:
      summary: Corrige a mano la ficha de una película (solo administradores)
      description: |
        Con un `tmdb_id` guarda la ficha de TMDB como corrección manual. Con
        `null` marca la película como «no es ninguna» y limpia sus metadatos.
        Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMatchRequest'
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Cuerpo no válido o tmdb_id incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al guardar la ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Vuelve a identificar una película automáticamente (solo administradores)
      description: |
        Limpia la corrección manual, restaura el año analizado del archivo y
        vuelve a identificar la película con TMDB. Si no hay coincidencia, el
        ítem queda sin identificar. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Ítem resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al guardar la ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/images:
    get:
      summary: Imágenes de TMDB disponibles para una película (solo administradores)
      description: |
        Devuelve los carteles y fondos de TMDB ordenados por idioma
        (es-ES, es, en, sin idioma y el resto) y, dentro de cada idioma, por
        valoración. Incluye una URL de listado y otra a tamaño completo.
        Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Imágenes disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageOptions'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o no es una película
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La película no está identificada en TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/images/{kind}:
    put:
      summary: Fija una imagen propia (solo administradores)
      description: |
        Guarda la URL indicada como póster o fondo y marca esa imagen como
        fijada, para que el escaneo no la sustituya. No necesita TMDB ni que la
        película esté identificada. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/ImageKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageURLRequest'
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Cuerpo no válido o URL no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem, no es una película o el tipo de imagen no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al guardar la imagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Vuelve a la imagen de TMDB o la deja vacía (solo administradores)
      description: |
        Si la película está identificada, consulta TMDB y reescribe solo esa
        imagen con el valor actual; si no lo está, deja la imagen vacía. En
        ambos casos quita el bloqueo. Requiere una sesión con rol `admin`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/ImageKind'
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no tiene rol de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem, no es una película o el tipo de imagen no es válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno al actualizar la imagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: No se pudo consultar TMDB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TMDB no está configurado y la película está identificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/items/{id}/play:
    get:
      summary: Prepara la reproducción de un ítem
      description: |
        Elige entre reproducción directa (el contenedor se puede servir tal
        cual) y HLS MPEG-TS (recodificado a H.264 + AAC estéreo), y devuelve
        una URL firmada válida 8 horas (los segmentos reutilizan su firma). La URL apunta a `/api/v1/stream/...` y no requiere la
        cabecera de sesión: la autorización es la propia firma.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: URL de reproducción preparada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Contenedor no soportado para reproducción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}:
    get:
      summary: Sirve el archivo directo o la playlist remux
      description: |
        Endpoint de las URLs firmadas. Con modo directo sirve el archivo con
        soporte de rangos HTTP; con modo remux sirve la playlist HLS. Una firma
        ausente, manipulada o caducada se rechaza con 403.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo o playlist
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '206':
          description: Parte del archivo directo (petición con Range)
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe el ítem o el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/{id}/{file}:
    get:
      summary: Sirve la playlist o un segmento HLS
      description: |
        Archivos HLS: `playlist.m3u8` (VOD completa desde la primera petición)
        o `segment_XXXXX.ts` (MPEG-TS, `video/mp2t`). La playlist que se
        entrega lleva la firma en las URLs de sus segmentos. Un segmento que
        aún no existe se genera bajo demanda: si queda lejos de lo ya
        generado, el servidor relanza FFmpeg en él.
      security: []
      parameters:
        - $ref: '#/components/parameters/StreamId'
        - name: file
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo del remux
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Firma no válida o URL caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nombre de archivo no válido o inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: FFmpeg no está disponible para el remux
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ImageKind:
      name: kind
      in: path
      required: true
      description: Tipo de imagen que se fija o se restaura.
      schema:
        type: string
        enum:
          - poster
          - backdrop
    StreamId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    SignatureExp:
      name: exp
      in: query
      required: true
      description: Caducidad de la URL, en segundos desde la época Unix.
      schema:
        type: integer
        format: int64
    Signature:
      name: sig
      in: query
      required: true
      description: Firma HMAC-SHA256 del ítem y la caducidad.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error para el cliente.
      additionalProperties: false
    ServerVersion:
      type: object
      required:
        - server
        - commit
        - built_at
      properties:
        server:
          type: string
          description: Versión del servidor, tomada del archivo VERSION al compilar.
        commit:
          type: string
          description: Hash corto del commit de la compilación; vacío si no se inyectó.
        built_at:
          type: string
          description: Fecha UTC de la compilación en RFC3339; vacía si no se inyectó.
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false
    LoginResponse:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          description: Token de sesión en claro; no se vuelve a poder consultar.
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    CurrentUserResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - user
      additionalProperties: false
    Library:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
      additionalProperties: false
    LibrariesResponse:
      type: object
      required:
        - libraries
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
      additionalProperties: false
    CreateLibraryRequest:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Ruta existente y que sea un directorio en el servidor.
      additionalProperties: false
    ScanStarted:
      type: object
      required:
        - started
      properties:
        started:
          type: boolean
          description: Indica que el escaneo se ha lanzado.
      additionalProperties: false
    ScanStatus:
      type: object
      required:
        - running
        - started_at
        - finished_at
        - libraries
        - files
        - upserted
        - identified
        - unidentified
        - warnings
        - error
      properties:
        running:
          type: boolean
          description: Hay un escaneo en marcha.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Inicio del escaneo en UTC; `null` si aún no se ha lanzado ninguno.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Fin del escaneo en UTC; `null` mientras corre o si aún no se ha lanzado ninguno.
        libraries:
          type: integer
          description: Bibliotecas recorridas.
        files:
          type: integer
          description: Archivos de vídeo encontrados.
        upserted:
          type: integer
          description: Entradas de `media_items` creadas o actualizadas.
        identified:
          type: integer
          description: Películas identificadas con TMDB en este escaneo.
        unidentified:
          type: integer
          description: Películas consultadas sin coincidencia.
        warnings:
          type: array
          description: Avisos que no abortaron el escaneo. Siempre es un array, aunque esté vacío.
          items:
            type: string
        error:
          type: string
          description: Mensaje del error que detuvo el escaneo; vacío si terminó bien.
      additionalProperties: false
    Candidate:
      type: object
      required:
        - tmdb_id
        - title
        - original_title
        - year
        - overview
        - poster_url
        - popularity
        - vote_count
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        original_title:
          type: string
        year:
          type: integer
        overview:
          type: string
        poster_url:
          type: string
        popularity:
          type: number
          format: double
        vote_count:
          type: integer
      additionalProperties: false
    CandidatesResponse:
      type: object
      required:
        - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
      additionalProperties: false
    UpdateMatchRequest:
      type: object
      required:
        - tmdb_id
      properties:
        tmdb_id:
          type: integer
          nullable: true
          description: Identificador de TMDB, o null para «no es ninguna».
      additionalProperties: false
    GenreCount:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
        count:
          type: integer
      additionalProperties: false
    GenresResponse:
      type: object
      required:
        - genres
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreCount'
      additionalProperties: false
    PlaybackInfo:
      type: object
      required:
        - mode
        - description
        - supported
      properties:
        mode:
          type: string
          enum:
            - direct
            - hls
            - ''
          description: Modo de reproducción; vacío si el contenedor no está soportado.
        description:
          type: string
        supported:
          type: boolean
      additionalProperties: false
    VideoStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - width
        - height
        - display_aspect_ratio
        - frame_rate
        - bit_rate
        - pixel_format
        - bit_depth
        - hdr
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        width:
          type: integer
        height:
          type: integer
        display_aspect_ratio:
          type: string
        frame_rate:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        pixel_format:
          type: string
        bit_depth:
          type: integer
        hdr:
          type: string
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    AudioStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - channels
        - channel_layout
        - sample_rate
        - bit_rate
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        channels:
          type: integer
        channel_layout:
          type: string
        sample_rate:
          type: integer
        bit_rate:
          type: integer
          format: int64
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    SubtitleStream:
      type: object
      required:
        - index
        - codec
        - language
        - title
        - forced
        - default
        - text
      properties:
        index:
          type: integer
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        default:
          type: boolean
        text:
          type: boolean
      additionalProperties: false
    FileInfo:
      type: object
      required:
        - container
        - container_long_name
        - size_bytes
        - duration_seconds
        - bit_rate
        - modified_at
        - file_name
        - video
        - audio
        - subtitles
        - chapters
        - quality
      properties:
        container:
          type: string
        container_long_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        modified_at:
          type: string
          format: date-time
        file_name:
          type: string
        video:
          type: array
          items:
            $ref: '#/components/schemas/VideoStream'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/AudioStream'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleStream'
        chapters:
          type: integer
        quality:
          type: string
    FileInfoResponse:
      allOf:
        - $ref: '#/components/schemas/FileInfo'
        - type: object
          required:
            - path
            - playback
          properties:
            path:
              type: string
              description: Ruta del archivo relativa a la raíz de su biblioteca, con separadores `/`.
            playback:
              $ref: '#/components/schemas/PlaybackInfo'
    ImageURLRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: URL http o https, sin espacios y de 2048 caracteres como máximo.
          maxLength: 2048
      additionalProperties: false
    ImageOption:
      type: object
      required:
        - url
        - full_url
        - language
        - vote_average
        - width
        - height
      properties:
        url:
          type: string
          description: URL para listados.
        full_url:
          type: string
          description: URL a tamaño completo.
        language:
          type: string
          description: Código de idioma de la imagen; vacío si no tiene idioma.
        vote_average:
          type: number
          format: double
        width:
          type: integer
        height:
          type: integer
      additionalProperties: false
    ImageOptions:
      type: object
      required:
        - posters
        - backdrops
      properties:
        posters:
          type: array
          description: Carteles disponibles, siempre un array.
          items:
            $ref: '#/components/schemas/ImageOption'
        backdrops:
          type: array
          description: Fondos disponibles, siempre un array.
          items:
            $ref: '#/components/schemas/ImageOption'
      additionalProperties: false
    PlaybackProgress:
      type: object
      required:
        - position_seconds
        - duration_seconds
        - updated_at
      properties:
        position_seconds:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: number
          format: double
          minimum: 0
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    ProgressRequest:
      type: object
      required:
        - position_seconds
        - duration_seconds
      properties:
        position_seconds:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: number
          format: double
          minimum: 0
      additionalProperties: false
    HomeCounts:
      type: object
      required:
        - movies
        - episodes
      properties:
        movies:
          type: integer
          format: int64
        episodes:
          type: integer
          format: int64
      additionalProperties: false
    HomeResponse:
      type: object
      required:
        - continue
        - next_up
        - recent_movies
        - counts
      properties:
        continue:
          type: array
          description: Ítems con progreso, ordenados por actualización descendente.
          items:
            $ref: '#/components/schemas/MediaItem'
        next_up:
          type: array
          description: Reservado para series; por ahora siempre está vacío.
          items:
            $ref: '#/components/schemas/MediaItem'
        recent_movies:
          type: array
          description: Las 20 últimas películas añadidas, por id descendente.
          items:
            $ref: '#/components/schemas/MediaItem'
        counts:
          $ref: '#/components/schemas/HomeCounts'
      additionalProperties: false
    MediaItem:
      type: object
      required:
        - id
        - library_id
        - path
        - title
        - file_title
        - year
        - kind
        - season
        - episode
        - tmdb_id
        - overview
        - poster_url
        - poster_custom
        - original_title
        - imdb_id
        - tagline
        - genres
        - runtime_minutes
        - rating
        - directors
        - cast
        - backdrop_url
        - backdrop_custom
        - overview_language
        - match_status
        - match_score
        - watched
        - progress
      properties:
        id:
          type: integer
          format: int64
        library_id:
          type: integer
          format: int64
        path:
          type: string
        title:
          type: string
          description: Título visible; usa el de TMDB si existe.
        file_title:
          type: string
          description: Título analizado del nombre del archivo.
        year:
          type: integer
          nullable: true
        kind:
          type: string
          enum:
            - movie
            - series
            - episode
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        tmdb_id:
          type: integer
          format: int64
          nullable: true
        overview:
          type: string
          nullable: true
        poster_url:
          type: string
          nullable: true
        poster_custom:
          type: boolean
          description: El póster está fijado a mano y el escaneo no lo cambiará.
        original_title:
          type: string
          nullable: true
        imdb_id:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        genres:
          type: array
          description: Géneros; siempre es un array, aunque esté vacío.
          items:
            type: string
        runtime_minutes:
          type: integer
          nullable: true
        rating:
          type: number
          format: double
          nullable: true
        directors:
          type: array
          description: Dirección; siempre es un array, aunque esté vacío.
          items:
            type: string
        cast:
          type: array
          description: Reparto; siempre es un array, aunque esté vacío.
          items:
            type: string
        backdrop_url:
          type: string
          nullable: true
        backdrop_custom:
          type: boolean
          description: El fondo está fijado a mano y el escaneo no lo cambiará.
        overview_language:
          type: string
          nullable: true
        match_status:
          type: string
          nullable: true
          enum:
            - auto
            - manual
            - none
        match_score:
          type: number
          format: double
          nullable: true
        watched:
          type: boolean
          description: El usuario de la sesión ha marcado este ítem como visto.
        progress:
          allOf:
            - $ref: '#/components/schemas/PlaybackProgress'
          nullable: true
          description: Progreso del usuario de la sesión; null si no hay.
      additionalProperties: false
    ItemsResponse:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    PlayResponse:
      type: object
      required:
        - url
        - mode
        - expires_at
      properties:
        url:
          type: string
          description: |
            URL relativa firmada. Para modo directo apunta al archivo; para
            remux, a la playlist HLS.
        mode:
          type: string
          enum:
            - direct
            - remux
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
