  /api/v1/music/albums/{id}/cover:
    get:
      summary: Carátula de un álbum
      description: |
        Sirve el archivo cover/folder/front/album de la carpeta o, si no hay,
        la imagen incrustada de la primera pista que la tenga. La imagen
        incrustada se extrae con FFmpeg y se cachea en disco.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Imagen de carátula
          headers:
            ETag:
              description: Etiqueta de la imagen para validar la caché.
              schema:
                type: string
            Cache-Control:
              description: private, max-age=86400
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: La carátula no ha cambiado
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Álbum o carátula no encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Demasiadas carátulas generándose a la vez
          headers:
            Retry-After:
              description: Segundos que conviene esperar.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/music/tracks:
    get:
      summary: Busca pistas de música
      description: Busca por título, artista o álbum sin distinguir mayúsculas.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MusicQuery'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Pistas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicTracksResponse'
        '400':
          description: Parámetros no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/music/tracks/{id}/play:
    get:
      summary: Prepara la reproducción de una pista
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: URL firmada y datos de reproducción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicPlayResponse'
        '401':
          description: Sesión no válida o ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pista no encontrada o fuera de su biblioteca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/stream/music/{id}:
    get:
      summary: Sirve una pista firmada
      description: |
        Sirve el archivo de audio con soporte de rangos HTTP. La URL caduca y
        la firma pertenece al espacio de nombres de música; no vale para vídeos.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/SignatureExp'
        - $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: Archivo completo
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/mp4:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        '206':
          description: Fragmento solicitado con Range
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '403':
          description: Firma no válida o caducada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pista no encontrada o fuera de su biblioteca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    PageLimit:
      name: limit
      in: query
      description: Número máximo de elementos.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageOffset:
      name: offset
      in: query
      description: Elementos que se saltan antes de devolver la página.
      schema:
        type: integer
        minimum: 0
        default: 0
    MusicQuery:
      name: q
      in: query
      description: Texto de búsqueda; no distingue mayúsculas.
      schema:
        type: string
    MusicLetter:
      name: letter
      in: query
      description: Letra inicial A-Z o #.
      schema:
        type: string
        minLength: 1
        maxLength: 1
    SignatureExp:
      name: exp
      in: query
      required: true
      description: Caducidad de la firma en segundos Unix.
      schema:
        type: integer
        format: int64
    Signature:
      name: sig
      in: query
      required: true
      description: Firma HMAC de la URL.
      schema:
        type: string
    ImageKind:
      name: kind
      in: path
      required: true
      description: Tipo de imagen que se fija o se restaura.
      schema:
        type: string
        enum:
          - poster
          - backdrop
    ItemId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    StreamId:
      name: id
      in: path
      required: true
      description: Identificador del ítem.
      schema:
        type: integer
        format: int64
        minimum: 1
    SignatureExp:
      name: exp
      in: query
      required: true
      description: Caducidad de la URL, en segundos desde la época Unix.
      schema:
        type: integer
        format: int64
    Signature:
      name: sig
      in: query
      required: true
      description: Firma HMAC-SHA256 del ítem y la caducidad.
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensaje de error para el cliente.
      additionalProperties: false
    ServerVersion:
      type: object
      required:
        - server
        - commit
        - built_at
      properties:
        server:
          type: string
          description: Versión del servidor, tomada del archivo VERSION al compilar.
        commit:
          type: string
          description: Hash corto del commit de la compilación; vacío si no se inyectó.
        built_at:
          type: string
          description: Fecha UTC de la compilación en RFC3339; vacía si no se inyectó.
      additionalProperties: false
    UpdateStatus:
      type: object
      required:
        - phase
        - tag
        - message
        - started_at
        - finished_at
        - result
      properties:
        phase:
          type: string
        tag:
          type: string
        message:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        result:
          type: string
      additionalProperties: false
    UpdateResponse:
      type: object
      required:
        - current
        - latest
        - available
        - checked_at
        - notes
        - apply_supported
        - check_enabled
        - status
      properties:
        current:
          type: string
        latest:
          type: string
        available:
          type: boolean
        checked_at:
          type: string
          description: RFC3339 o cadena vacía si aún no se ha comprobado.
        notes:
          type: string
        apply_supported:
          type: boolean
        check_enabled:
          type: boolean
        status:
          $ref: '#/components/schemas/UpdateStatus'
      additionalProperties: false
    UpdateApplyRequest:
      type: object
      required:
        - tag
      properties:
        tag:
          type: string
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      additionalProperties: false
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      additionalProperties: false
    LoginResponse:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          description: Token de sesión en claro; no se vuelve a poder consultar.
        expires_at:
          type: string
          format: date-time
      additionalProperties: false
    CurrentUserResponse:
      type: object
      required:
        - username
        - role
      properties:
        username:
          type: string
        role:
          type: string
          enum:
            - admin
            - user
      additionalProperties: false
    Library:
      type: object
      required:
        - id
        - name
        - kind
        - path
        - paths
        - item_count
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [video, clips, music]
        path:
          type: string
          description: Carpeta principal, por compatibilidad con clientes antiguos.
        paths:
          type: array
          items:
            $ref: '#/components/schemas/LibraryPath'
        item_count:
          type: integer
          format: int64
      additionalProperties: false
    LibraryPath:
      type: object
      required:
        - id
        - path
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
      additionalProperties: false
    ClipRoot:
      type: object
      required:
        - id
        - name
        - item_count
        - cover_item_id
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Último componente de la carpeta, desambiguado con el padre si hace falta.
        item_count:
          type: integer
          format: int64
        cover_item_id:
          type: integer
          format: int64
          nullable: true
          description: Primer vídeo por nombre dentro de la carpeta y sus subcarpetas; null si no hay vídeos.
      additionalProperties: false
    ClipRootsResponse:
      type: object
      required:
        - roots
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/ClipRoot'
      additionalProperties: false
    ClipLibraryRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties: false
    ClipRootRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties: false
    ClipBreadcrumb:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
          description: Ruta relativa a la raíz; vacía para la raíz.
      additionalProperties: false
    ClipFolder:
      type: object
      required:
        - name
        - path
        - item_count
        - cover_item_id
      properties:
        name:
          type: string
        path:
          type: string
          description: Ruta relativa a la raíz.
        item_count:
          type: integer
          format: int64
          description: Vídeos de la carpeta y sus subcarpetas.
        cover_item_id:
          type: integer
          format: int64
          nullable: true
          description: Primer vídeo por nombre dentro de la carpeta y sus subcarpetas; null si no hay vídeos.
      additionalProperties: false
    ClipBrowseResponse:
      type: object
      required:
        - library
        - root
        - path
        - parent
        - crumbs
        - folders
        - items
        - total
        - limit
        - offset
      properties:
        library:
          $ref: '#/components/schemas/ClipLibraryRef'
        root:
          $ref: '#/components/schemas/ClipRootRef'
        path:
          type: string
          description: Ruta relativa a la raíz; vacía para la raíz.
        parent:
          type: string
          nullable: true
          description: Ruta relativa de la carpeta padre; null en la raíz.
        crumbs:
          type: array
          items:
            $ref: '#/components/schemas/ClipBreadcrumb'
        folders:
          type: array
          description: Subcarpetas inmediatas que contienen vídeos.
          items:
            $ref: '#/components/schemas/ClipFolder'
        items:
          type: array
          description: Vídeos de la carpeta actual; la ruta de cada ítem es relativa a la raíz.
          items:
            $ref: '#/components/schemas/MediaItem'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
      additionalProperties: false
    UpdateLibraryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
    LibraryPathRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
      additionalProperties: false
    FSEntry:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
      additionalProperties: false
    FSRootsResponse:
      type: object
      required:
        - roots
      properties:
        roots:
          type: array
          items:
            $ref: '#/components/schemas/FSEntry'
      additionalProperties: false
    FSBrowseResponse:
      type: object
      required:
        - path
        - parent
        - entries
        - truncated
      properties:
        path:
          type: string
        parent:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FSEntry'
        truncated:
          type: boolean
      additionalProperties: false
    LibrariesResponse:
      type: object
      required:
        - libraries
      properties:
        libraries:
          type: array
          items:
            $ref: '#/components/schemas/Library'
      additionalProperties: false
    CreateLibraryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [video, clips, music]
          default: video
        path:
          type: string
          description: Formato antiguo de una sola carpeta. Se puede usar en lugar de `paths`.
        paths:
          type: array
          items:
            type: string
          description: Carpetas existentes dentro de las raíces permitidas.
      additionalProperties: false
    ScanStarted:
      type: object
      required:
        - started
      properties:
        started:
          type: boolean
          description: Indica que el escaneo se ha lanzado.
      additionalProperties: false
    ScanStatus:
      type: object
      required:
        - running
        - started_at
        - finished_at
        - libraries
        - files
        - upserted
        - identified
        - unidentified
        - warnings
        - error
      properties:
        running:
          type: boolean
          description: Hay un escaneo en marcha.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Inicio del escaneo en UTC; `null` si aún no se ha lanzado ninguno.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Fin del escaneo en UTC; `null` mientras corre o si aún no se ha lanzado ninguno.
        libraries:
          type: integer
          description: Bibliotecas recorridas.
        files:
          type: integer
          description: Archivos de vídeo encontrados.
        upserted:
          type: integer
          description: Entradas de `media_items` creadas o actualizadas.
        identified:
          type: integer
          description: Películas identificadas con TMDB en este escaneo.
        unidentified:
          type: integer
          description: Películas consultadas sin coincidencia.
        warnings:
          type: array
          description: Avisos que no abortaron el escaneo. Siempre es un array, aunque esté vacío.
          items:
            type: string
        error:
          type: string
          description: Mensaje del error que detuvo el escaneo; vacío si terminó bien.
      additionalProperties: false
    Candidate:
      type: object
      required:
        - tmdb_id
        - title
        - original_title
        - year
        - overview
        - poster_url
        - popularity
        - vote_count
      properties:
        tmdb_id:
          type: integer
        title:
          type: string
        original_title:
          type: string
        year:
          type: integer
        overview:
          type: string
        poster_url:
          type: string
        popularity:
          type: number
          format: double
        vote_count:
          type: integer
      additionalProperties: false
    CandidatesResponse:
      type: object
      required:
        - candidates
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
      additionalProperties: false
    UpdateMatchRequest:
      type: object
      required:
        - tmdb_id
      properties:
        tmdb_id:
          type: integer
          nullable: true
          description: Identificador de TMDB, o null para «no es ninguna».
      additionalProperties: false
    GenreCount:
      type: object
      required:
        - name
        - count
      properties:
        name:
          type: string
        count:
          type: integer
      additionalProperties: false
    GenresResponse:
      type: object
      required:
        - genres
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreCount'
      additionalProperties: false
    PlaybackInfo:
      type: object
      required:
        - mode
        - description
        - supported
      properties:
        mode:
          type: string
          enum:
            - direct
            - hls
            - ''
          description: Modo de reproducción; vacío si el contenedor no está soportado.
        description:
          type: string
        supported:
          type: boolean
      additionalProperties: false
    VideoStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - width
        - height
        - display_aspect_ratio
        - frame_rate
        - bit_rate
        - pixel_format
        - bit_depth
        - hdr
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        width:
          type: integer
        height:
          type: integer
        display_aspect_ratio:
          type: string
        frame_rate:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        pixel_format:
          type: string
        bit_depth:
          type: integer
        hdr:
          type: string
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    AudioStream:
      type: object
      required:
        - index
        - codec
        - codec_long_name
        - profile
        - channels
        - channel_layout
        - sample_rate
        - bit_rate
        - language
        - title
        - default
      properties:
        index:
          type: integer
        codec:
          type: string
        codec_long_name:
          type: string
        profile:
          type: string
        channels:
          type: integer
        channel_layout:
          type: string
        sample_rate:
          type: integer
        bit_rate:
          type: integer
          format: int64
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
      additionalProperties: false
    SubtitleStream:
      type: object
      required:
        - index
        - codec
        - language
        - title
        - forced
        - default
        - text
      properties:
        index:
          type: integer
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        default:
          type: boolean
        text:
          type: boolean
      additionalProperties: false
    FileInfo:
      type: object
      required:
        - container
        - container_long_name
        - size_bytes
        - duration_seconds
        - bit_rate
        - modified_at
        - file_name
        - video
        - audio
        - subtitles
        - chapters
        - quality
      properties:
        container:
          type: string
        container_long_name:
          type: string
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: number
          format: double
        bit_rate:
          type: integer
          format: int64
        modified_at:
          type: string
          format: date-time
        file_name:
          type: string
        video:
          type: array
          items:
            $ref: '#/components/schemas/VideoStream'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/AudioStream'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleStream'
        chapters:
          type: integer
        quality:
          type: string
    FileInfoResponse:
      allOf:
        - $ref: '#/components/schemas/FileInfo'
        - type: object
          required:
            - path
            - playback
          properties:
            path:
              type: string
              description: Ruta del archivo relativa a la raíz de su biblioteca, con separadores `/`.
            playback:
              $ref: '#/components/schemas/PlaybackInfo'
    ImageURLRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: URL http o https, sin espacios y de 2048 caracteres como máximo.
          maxLength: 2048
      additionalProperties: false
    ImageOption:
      type: object
      required:
        - url
        - full_url
        - language
        - vote_average
        - width
        - height
      properties:
        url:
          type: string
          description: URL para listados.
        full_url:
          type: string
          description: URL a tamaño completo.
        language:
          type: string
          description: Código de idioma de la imagen; vacío si no tiene idioma.
        vote_average:
          type: number
          format: double
        width:
          type: integer
        height:
          type: integer
      additionalProperties: false
    ImageOptions:
      type: object
      required:
        - posters
        - backdrops
      properties:
        posters:
          type: array
          description: Carteles disponibles, siempre un array.
          items:
            $ref: '#/components/schemas/ImageOption'
        backdrops:
          type: array
          description: Fondos disponibles, siempre un array.
          items:
            $ref: '#/components/schemas/ImageOption'
      additionalProperties: false
    PlaybackProgress:
      type: object
      required:
        - position_seconds
        - duration_seconds
        - updated_at
      properties:
        position_seconds:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: number
          format: double
          minimum: 0
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    ProgressRequest:
      type: object
      required:
        - position_seconds
        - duration_seconds
      properties:
        position_seconds:
          type: number
          format: double
          minimum: 0
        duration_seconds:
          type: number
          format: double
          minimum: 0
      additionalProperties: false
    HomeCounts:
      type: object
      required:
        - movies
        - episodes
        - series
      properties:
        movies:
          type: integer
          format: int64
        episodes:
          type: integer
          format: int64
        series:
          type: integer
          format: int64
      additionalProperties: false
    HomeResponse:
      type: object
      required:
        - continue
        - next_up
        - recent_movies
        - recent_series
        - has_clips
        - has_music
        - counts
      properties:
        continue:
          type: array
          description: Ítems con progreso, ordenados por actualización descendente.
          items:
            $ref: '#/components/schemas/MediaItem'
        next_up:
          type: array
          description: Siguiente episodio por ver de cada serie con actividad, sin repetir las que están en continue.
          items:
            $ref: '#/components/schemas/MediaItem'
        recent_movies:
          type: array
          description: Las 20 últimas películas añadidas, por id descendente.
          items:
            $ref: '#/components/schemas/MediaItem'
        recent_series:
          type: array
          description: Las 20 últimas series con episodios, por fecha de alta descendente.
